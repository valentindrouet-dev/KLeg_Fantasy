# Publie le site construit sur la branche gh-pages à chaque push (spec 13.1, voir docs/DEPLOY.md).
# Réglage GitHub : Settings > Pages > Deploy from a branch > gh-pages / (root).
name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/sharp-curie-b9evuk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Garder les anciens fichiers : une page encore en cache dans le navigateur (10 min sur GitHub Pages)
          # réclame les anciens noms de fichiers ; s'ils disparaissent, la page reste blanche.
          keep_files: true
